# @genqlient(for: "ComponentVersionInput.latestVersion", pointer: true, omitempty: true)
mutation CreateComponentVersion(
    $input: ComponentVersionInput!
) {
     # @genqlient(typename: "ComponentVersion")
    createComponentVersion (
        input: $input
    ) {
        id
        version
        componentId
        endOfLife
    }
}