# @genqlient(for: "ComponentVersionInput.latestVersion", pointer: true, omitempty: true)
mutation UpdateComponentVersion(
    $id: ID!,
    $input: ComponentVersionInput!
) {
    updateComponentVersion (
        id: $id,
        input: $input
    ) {
        __typename
        id
        version
        componentId
        tag
    }
}