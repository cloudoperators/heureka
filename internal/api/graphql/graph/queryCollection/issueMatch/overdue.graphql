query ($filter: IssueMatchFilter, $first: Int, $after: String, $orderBy: [IssueMatchOrderBy]) {
    IssueMatchesOverdue (
        filter: $filter,
        first: $first,
        after: $after,
        orderBy: $orderBy
    ) {
        totalCount
        edges {
            node {
                id
                status
                severity {
                    value
                    score
                }
                targetRemediationDate
                issue {
                    primaryName
                    type
                }
                componentInstance {
                    ccrn
                    service {
                        ccrn
                    }
                }
            }
            cursor
        }
        pageInfo {
            hasNextPage
            hasPreviousPage
            isValidPage
            pageNumber
            nextPageAfter
            pages {
                after
                isCurrent
                pageNumber
                pageCount
            }
        }
    }
}
