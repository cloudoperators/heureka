mutation UpdateSIEMAlert($id: ID!, $input: SIEMAlertUpdateInput!, $comment: String!) {
    updateSIEMAlert(id: $id, input: $input, comment: $comment) {
        id
        status
        service
        supportGroup
        severity
        name
        description
    }
}
