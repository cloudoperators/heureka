query ($filter: SIEMAlertFilter, $first: Int, $after: String) {
    SIEMAlerts (
        filter: $filter,
        first: $first,
        after: $after
    ) {
        totalCount
        edges {
            node {
                id
            }
            cursor
        }
    }
}
