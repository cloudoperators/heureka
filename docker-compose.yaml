  heureka-app:
    image: heureka-app:latest
    build: .
    container_name: heureka-app
    profiles:
      - heureka
    environment:
#      DB_ADDRESS: heureka-db
      DB_ADDRESS: maxscale
      DB_PORT: 4006
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      SEED_MODE: ${SEED_MODE}
      AI_ENABLE: ${AI_ENABLE:-false}
      AI_SAP_PROXY_URL: ${AI_SAP_PROXY_URL:-}
      AI_SAP_PROXY_MODEL: ${AI_SAP_PROXY_MODEL:-}
      AI_SAP_PROXY_TOKEN: ${AI_SAP_PROXY_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_HTTP_RATE_LIMIT: ${AI_HTTP_RATE_LIMIT:-5}
      AI_HTTP_RATE_BURST: ${AI_HTTP_RATE_BURST:-5}
      TESTING_ENABLE: true
    depends_on:
#      heureka-db:
      maxscale:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app

  valkey:
    image: valkey/valkey:7.2
    container_name: heureka-valkey
    profiles:
      - heureka
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    command: [ "valkey-server", "--appendonly", "yes" ]
    volumes:
      - valkey-data:/data
    restart: always
    networks:
      - app

  ui:
    image: juno-ui:latest
    build:
      context: ./ui/
      dockerfile: Dockerfile
      args:
        UI_GIT_REPO: https://github.com/cloudoperators/juno/
        UI_GIT_DIR: ./ui/juno/
    container_name: juno-ui
    profiles:
      - ui
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgres:17
    container_name: postgres
    profiles:
      - openfga
    networks:
      - openfga
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    image: openfga/openfga:latest
    container_name: migrate
    profiles:
      - openfga
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
    networks:
      - openfga

  heureka-openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: openfga/openfga:latest
    container_name: openfga
    profiles:
      - openfga
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
      - OPENFGA_LOG_FORMAT=json
      - OPENFGA_AUTHN_METHOD=preshared
      - OPENFGA_AUTHN_PRESHARED_KEYS=${AUTHZ_FGA_API_TOKEN}
    command: run
    networks:
      - openfga
    ports:
      # HTTP server
      - "8080:8080"
      # GRPC server
      - "8081:8081"
      # Playground
      - "8082:3000"
volumes:
  valkey-data:
  mariadb-primary-data:
  mariadb-replica1-data:
  mariadb-replica2-data:

networks:
  app:
    driver: bridge
  database:
    driver: bridge
    internal: true
  openfga:

