# This docker-compose file is used to run the application localy in containarized environment.
# ensure to set .env file accordingly
services:
  mariadb-primary:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --server-id=1
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --lower_case_table_names=1
    volumes:
      - .db/mariadb-primary-data:/var/lib/mysql
    networks:
      database:
        aliases:
          - mariadb-primary
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb-replica1:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --server-id=2
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --read-only=ON
      - --lower_case_table_names=1
    volumes:
      - .db/mariadb-replica1-data:/var/lib/mysql
    networks:
      database:
        aliases:
          - mariadb-replica1
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb-replica2:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --server-id=3
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --read-only=ON
      - --lower_case_table_names=1
    volumes:
      - .db/mariadb-replica2-data:/var/lib/mysql
    networks:
      database:
        aliases:
          - mariadb-replica2
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  maxscale:
    image: mariadb/maxscale:latest
    volumes:
      - ./maxscale/maxscale.cnf:/etc/maxscale.cnf:ro
    ports:
      - "4006:4006"
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica1:
        condition: service_healthy
      mariadb-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "maxctrl list servers >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - database
      - app

