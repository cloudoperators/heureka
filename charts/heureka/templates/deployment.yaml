{{- $hasToken := and .Values.api .Values.api.authToken -}}
{{- $hasOidc  := and .Values.oidc .Values.oidc.url -}}
{{- if not (or $hasToken $hasOidc) -}}
{{- fail "At least one of api.authToken or oidc.url must be set. Running without either would leave the API unauthenticated." -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heureka.fullname" . }}
  labels:
    {{- include "heureka.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/targets: "kubernetes"
    secret.reloader.stakater.com/reload: {{ include "heureka.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "heureka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heureka.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/targets: kubernetes
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "heureka.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.serverTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: mariadb-schema-init-volume
              mountPath: /app/schema-init/schema.sql
              subPath: schema.sql
          env:
            - name: ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: {{ include "heureka.fullname" . }}
                  key: environment
            - name: SERVER_PORT
              value: ":{{ .Values.service.port }}"
            - name: SEED_MODE
              value: "{{ .Values.seedMode }}"
            - name: DB_NAME
              value: "heureka"
            - name: DB_PORT
              value: "3306"
            - name: DB_SCHEMA
              value: "/app/schema-init/schema.sql"
            - name: DB_USER
              value: "my_username"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "heureka.fullname" . }}-mariadb
                  key: mariadb-password
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "heureka.fullname" . }}-mariadb
                  key: mariadb-root-password
            - name: DB_ADDRESS
              value: "heureka-mariadb.heureka.svc.cluster.local"
            {{- if and .Values.api .Values.api.authToken }}
            - name: AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "heureka.fullname" . }}
                  key: auth-token-secret
            {{- end }}
            {{- if and .Values.oidc .Values.oidc.url }}
            - name: AUTH_OIDC_URL
              value: {{ .Values.oidc.url | quote }}
            - name: AUTH_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: mariadb-schema-init-volume
        configMap:
          name: {{ include "heureka.fullname" . }}-mariadb-schema
